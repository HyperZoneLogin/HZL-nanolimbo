name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # 主仓库发布时通过 repository_dispatch 同步触发（hzl-release / hzl-weekly）。
  repository_dispatch:
    types: [hzl-release, hzl-weekly]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # NanoLimbo 是本仓库的嵌套 submodule，必须递归检出。
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish HZL API to mavenLocal
        run: |
          git clone --depth 1 https://github.com/HyperZoneLogin/HyperzoneLogin.git .hzl-main
          cd .hzl-main
          ./gradlew :api:publishToMavenLocal -q

      - name: Build module jar
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ./gradlew clean build -PpluginVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew clean build
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HZL-nanolimbo
          path: build/libs/*.jar

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: HZL-nanolimbo ${{ github.ref_name }}
          artifacts: build/libs/*.jar
          generateReleaseNotes: true
